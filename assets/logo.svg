<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 36 356 440" width="100%" height="100%">
  <defs>
    <!-- Cyan to Royal Blue Shield Border -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Midnight Sapphire Shield Body -->
    <linearGradient id="shieldBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Sleek Cyber Cyan / Electric Sapphire Lock Body -->
    <linearGradient id="cyberLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>

    <!-- Crisp Platinum-to-Cyan Shackle -->
    <linearGradient id="shackle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Shield body -->
    <path d="M 256 44 L 422 106 C 422 272 342 396 256 464 C 170 396 90 272 90 106 Z"
          fill="url(#shieldBody)"
          stroke="url(#shieldBorder)"
          stroke-width="18"
          stroke-linejoin="round"/>

    <!-- Inner trim -->
    <path d="M 256 74 L 400 124 C 400 264 330 372 256 428 C 182 372 112 264 112 124 Z"
          fill="none"
          stroke="#00f5ff"
          stroke-opacity="0.35"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Left AST branches -->
    <path d="M 170 190 H 120 M 144 190 V 155 H 110 M 170 265 H 108 M 144 265 V 305 H 114 M 170 338 H 126"
          fill="none" stroke="#00f5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right AST branches -->
    <path d="M 342 190 H 392 M 368 190 V 155 H 402 M 342 265 H 404 M 368 265 V 305 H 398 M 342 338 H 386"
          fill="none" stroke="#00f5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left nodes -->
    <circle cx="110" cy="155" r="8" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>
    <circle cx="120" cy="190" r="9" fill="#00f5ff"/>
    <circle cx="108" cy="265" r="10" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>
    <circle cx="114" cy="305" r="8" fill="#00f5ff"/>
    <circle cx="126" cy="338" r="9" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>

    <!-- Right nodes -->
    <circle cx="402" cy="155" r="8" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>
    <circle cx="392" cy="190" r="9" fill="#00f5ff"/>
    <circle cx="404" cy="265" r="10" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>
    <circle cx="398" cy="305" r="8" fill="#00f5ff"/>
    <circle cx="386" cy="338" r="9" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>

    <!-- Padlock shackle arc -->
    <path d="M 204 180 V 118 C 204 88 227 64 256 64 C 285 64 308 88 308 118 V 180"
          fill="none"
          stroke="url(#shackle)"
          stroke-width="26"
          stroke-linecap="round"/>

    <!-- Padlock body -->
    <rect x="174" y="170" width="164" height="172" rx="26"
          fill="url(#cyberLock)"
          stroke="#ffffff"
          stroke-width="5"/>

    <!-- Padlock inner bevel / facet lines -->
    <path d="M 174 170 L 256 246 L 338 170 M 174 342 L 256 246 L 338 342"
          fill="none" stroke="#e0f2fe" stroke-opacity="0.35" stroke-width="3.5"/>

    <!-- Keyhole / Core aperture -->
    <circle cx="256" cy="234" r="20" fill="#030712" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="247,234 265,234 271,280 241,280" fill="#030712"/>
    <circle cx="256" cy="234" r="7" fill="#00f5ff"/>

    <!-- Bottom circuit / AST root -->
    <path d="M 256 342 V 404 M 232 372 H 256 M 256 390 H 280"
          fill="none" stroke="#00f5ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="232" cy="372" r="6" fill="#ffffff"/>
    <circle cx="280" cy="390" r="6" fill="#00f5ff"/>
    <circle cx="256" cy="404" r="8" fill="#ffffff" stroke="#00f5ff" stroke-width="3"/>
  </g>
</svg>
