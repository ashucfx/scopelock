name: ScopeLock CI/CD & PR Security Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit-and-test:
    name: Lint, Test & Capability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build package
        run: |
          python -m build

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v tests/

      - name: Run 25-Program Empirical Benchmark
        run: |
          python -m scopelock.benchmarks.runner

      - name: ScopeLock Self-Audit Test
        run: |
          scopelock audit-code --code "function add(a, b) { return a + b; }" --prompt "Build a local calculator CLI"

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
